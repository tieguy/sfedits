services:
  bot:
    build: .
    volumes:
      - ./config.json:/opt/sfedits/config.json:ro
      - ./drafts:/opt/sfedits/drafts
      - ./data:/opt/sfedits/data
    restart: unless-stopped
    # Memory limits for main bot process
    mem_limit: 256m
    mem_reservation: 128m

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CONFIG_PATH=/opt/sfedits/config.json
    volumes:
      - ./config.json:/opt/sfedits/config.json:ro
      - ./drafts:/opt/sfedits/drafts
      - ./data:/opt/sfedits/data
    restart: unless-stopped
    # Memory limits for admin web UI (needs 256MB for Puppeteer/Chromium)
    mem_limit: 256m
    mem_reservation: 128m

  maxmind-updater:
    image: curlimages/curl:latest
    volumes:
      - ./data:/data
      - ./scripts/update-maxmind.sh:/update-maxmind.sh:ro
    entrypoint: /bin/sh -c 'while true; do sh /update-maxmind.sh; sleep 604800; done'
    restart: unless-stopped
    # Minimal memory for curl updater
    mem_limit: 64m
    mem_reservation: 32m
